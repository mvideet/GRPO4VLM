[project]
name = "rl4vlm"
version = "0.1.0"
description = "RL4VLM: Reinforcement Learning for Vision-Language Models"
requires-python = ">=3.8"
dependencies = [
    # Core ML/RL dependencies
    "torch>=2.1.2",
    "torchvision>=0.16.2",
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "sentencepiece>=0.1.99",
    "accelerate==0.21.0",
    "peft==0.10.0",
    # "bitsandbytes",  # Not available on macOS ARM - install separately if needed on Linux
    
    # RL dependencies
    "gym",
    "matplotlib",
    # "pybullet",  # Not available on macOS ARM - install separately if needed on Linux
    "stable-baselines3",
    "h5py",
    
    # LLaVA dependencies
    "shortuuid",
    "pydantic",
    "markdown2[all]",
    "numpy",
    "scikit-learn>=1.3.0",
    "gradio==4.16.0",
    "gradio_client==0.8.1",
    "requests",
    "httpx==0.24.0",
    "uvicorn",
    "fastapi",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
    
    # OpenAI API for synthetic data generation
    "openai",
]

[project.optional-dependencies]
train = [
    "deepspeed>=0.14.0",
    "ninja",
    "wandb",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # Don't build root as package

